[project]
name = "tg-mcp"
version = "0.1.0"
description = "Local stdio MCP server for reading public Telegram channels and sending digests to Saved Messages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live TG_SESSION_STRING; skipped by default",
]
